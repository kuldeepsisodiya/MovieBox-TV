name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: npm test
      - name: Build WGT Package
        run: python3 tools/build-wgt.py
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MovieBoxTV.wgt
            build/MovieBoxTV-unsigned.wgt
          generate_release_notes: true
